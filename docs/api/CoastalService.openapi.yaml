openapi: 3.1.0
info:
    title: CoastalService API
    version: 1.0.0
security:
    - WorldMonitorKey: []
    - ApiKeyHeader: []
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/coastal/v1/list-stations:
        get:
            tags:
                - CoastalService
            summary: ListStations
            description: |-
                ListStations returns only ACTIVE prediction sites, with the capabilities
                 each one actually has. A station whose model failed to load reports
                 waterLevelPrediction=false rather than being hidden, so the UI can explain
                 the gap instead of silently omitting a site.
            operationId: ListStations
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "dataAvailable": true
                                "fetchedAt": 1717200000000
                                "stations":
                                    - "ageMinutes": 1
                                      "capabilities":
                                          "tide": true
                                          "warningPrediction": true
                                          "waterLevelPrediction": true
                                      "city": "example"
                                      "country": "US"
                                      "currentWaterLevel": 1.5
                            schema:
                                $ref: '#/components/schemas/ListStationsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/coastal/v1/get-forecast:
        get:
            tags:
                - CoastalService
            summary: GetForecast
            description: |-
                GetForecast returns current conditions plus the +1h/+3h/+6h outlook.
                 water_level_forecast.status is "ready" only when a compatible model
                 produced the numbers; otherwise it carries model_not_configured,
                 model_incompatible, insufficient_history or inference_failed and the
                 horizon list is empty. Callers must branch on status, never on presence.
            operationId: GetForecast
            parameters:
                - name: station_id
                  in: query
                  required: false
                  example: "example-id"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "baseTimestamp": 1717200000000
                                "current":
                                    "datum": "example"
                                    "hasTide": true
                                    "predictedTide": 1.5
                                    "residual": 1.5
                                    "trend": "example"
                                "data":
                                    "ageMinutes": 1
                                    "featureVersion": "example"
                                    "latestUpdate": 1
                                    "status": "example"
                                    "tideProvider": "worldmonitor"
                                "dataAvailable": true
                                "generatedAt": 1717200000000
                            schema:
                                $ref: '#/components/schemas/GetForecastResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/coastal/v1/get-history:
        get:
            tags:
                - CoastalService
            summary: GetHistory
            description: GetHistory returns the stored observation window for charting.
            operationId: GetHistory
            parameters:
                - name: station_id
                  in: query
                  required: false
                  example: "example-id"
                  schema:
                    type: string
                - name: hours
                  in: query
                  required: false
                  example: 1
                  schema:
                    type: integer
                    format: int32
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "dataAvailable": true
                                "fetchedAt": 1717200000000
                                "observations":
                                    - "timestamp": 1717200000000
                                      "waterLevel": 1.5
                                "stationId": "example-id"
                            schema:
                                $ref: '#/components/schemas/GetHistoryResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListStationsRequest:
            type: object
        ListStationsResponse:
            type: object
            properties:
                stations:
                    type: array
                    items:
                        $ref: '#/components/schemas/CoastalStation'
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                dataAvailable:
                    type: boolean
        CoastalStation:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                displayName:
                    type: string
                city:
                    type: string
                country:
                    type: string
                lat:
                    type: number
                    format: double
                lon:
                    type: number
                    format: double
                timezone:
                    type: string
                capabilities:
                    $ref: '#/components/schemas/StationCapabilities'
                dataStatus:
                    type: string
                    description: |-
                        "live" | "delayed" | "stale" | "unknown" — computed server-side from the
                         age of the newest observation, not from whether the feature is enabled.
                ageMinutes:
                    type: integer
                    format: int32
                riskLevel:
                    type: string
                    description: |-
                        "normal" | "advisory" | "watch" | "high" | "unknown". Model risk, not an
                         official flood warning.
                currentWaterLevel:
                    type: number
                    format: double
                hasCurrent:
                    type: boolean
                trend:
                    type: string
        StationCapabilities:
            type: object
            properties:
                waterLevelPrediction:
                    type: boolean
                warningPrediction:
                    type: boolean
                tide:
                    type: boolean
            description: |-
                What a station can actually do right now, derived from which model artifacts
                 loaded — never a hardcoded capability flag.
        GetForecastRequest:
            type: object
            properties:
                stationId:
                    type: string
        GetForecastResponse:
            type: object
            properties:
                station:
                    $ref: '#/components/schemas/CoastalStation'
                baseTimestamp:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                hasCurrent:
                    type: boolean
                current:
                    $ref: '#/components/schemas/CurrentConditions'
                weather:
                    $ref: '#/components/schemas/WeatherConditions'
                waterLevelForecast:
                    $ref: '#/components/schemas/WaterLevelForecast'
                warningForecast:
                    $ref: '#/components/schemas/WarningForecast'
                risk:
                    $ref: '#/components/schemas/RiskAssessment'
                data:
                    $ref: '#/components/schemas/DataProvenance'
                model:
                    $ref: '#/components/schemas/ModelProvenance'
                dataAvailable:
                    type: boolean
        CurrentConditions:
            type: object
            properties:
                waterLevel:
                    type: number
                    format: double
                trend:
                    type: string
                datum:
                    type: string
                hasTide:
                    type: boolean
                    description: |-
                        Tide and residual are only populated when a real astronomical tide source
                         is configured. has_tide=false means "unknown", never zero.
                predictedTide:
                    type: number
                    format: double
                residual:
                    type: number
                    format: double
        WeatherConditions:
            type: object
            properties:
                present:
                    type: boolean
                pressure:
                    type: number
                    format: double
                windSpeed:
                    type: number
                    format: double
                windDirection:
                    type: number
                    format: double
                windGust:
                    type: number
                    format: double
                precipitation:
                    type: number
                    format: double
                temperature:
                    type: number
                    format: double
        WaterLevelForecast:
            type: object
            properties:
                status:
                    type: string
                    description: |-
                        "ready" | "model_not_configured" | "model_incompatible"
                         | "insufficient_history" | "inference_failed" | "history_stale" | "no_history"
                reason:
                    type: string
                horizons:
                    type: array
                    items:
                        $ref: '#/components/schemas/WaterLevelHorizon'
        WaterLevelHorizon:
            type: object
            properties:
                horizon:
                    type: string
                timestamp:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                waterLevel:
                    type: number
                    format: double
                hasBounds:
                    type: boolean
                    description: |-
                        Empirical error band from held-out residuals, not a probabilistic
                         predictive interval. has_bounds=false when the model recorded no sigma.
                lowerBound:
                    type: number
                    format: double
                upperBound:
                    type: number
                    format: double
                hasTide:
                    type: boolean
                    description: |-
                        Astronomical tide at this horizon, and the implied non-tidal residual
                         (predicted level minus tide). has_tide=false outside the precomputed tide
                         coverage window — the fields are then meaningless, not zero.
                predictedTide:
                    type: number
                    format: double
                predictedResidual:
                    type: number
                    format: double
        WarningForecast:
            type: object
            properties:
                status:
                    type: string
                reason:
                    type: string
                horizons:
                    type: array
                    items:
                        $ref: '#/components/schemas/WarningHorizon'
        WarningHorizon:
            type: object
            properties:
                horizon:
                    type: string
                probability:
                    type: number
                    format: double
                warning:
                    type: boolean
                hasThreshold:
                    type: boolean
                    description: Per-horizon threshold from model metadata. Never assume 0.5.
                threshold:
                    type: number
                    format: double
        RiskAssessment:
            type: object
            properties:
                level:
                    type: string
                reason:
                    type: string
                basis:
                    type: string
        DataProvenance:
            type: object
            properties:
                status:
                    type: string
                ageMinutes:
                    type: integer
                    format: int32
                latestUpdate:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                waterLevelProvider:
                    type: string
                weatherProvider:
                    type: string
                tideProvider:
                    type: string
                featureVersion:
                    type: string
        ModelProvenance:
            type: object
            properties:
                regressionVersion:
                    type: string
                warningVersion:
                    type: string
        GetHistoryRequest:
            type: object
            properties:
                stationId:
                    type: string
                hours:
                    type: integer
                    format: int32
        GetHistoryResponse:
            type: object
            properties:
                stationId:
                    type: string
                observations:
                    type: array
                    items:
                        $ref: '#/components/schemas/ObservationPoint'
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                dataAvailable:
                    type: boolean
        ObservationPoint:
            type: object
            properties:
                timestamp:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                waterLevel:
                    type: number
                    format: double
